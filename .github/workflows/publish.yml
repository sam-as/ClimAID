name: Publish to PyPI

on:
  workflow_dispatch:
    release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check that the release tag matches the package version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('climaid/__init__.py', encoding='utf-8').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $VERSION   release tag: $GITHUB_REF_NAME"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match climaid.__version__ $VERSION"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

