[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climaid"
version = "0.4.0"
description = "ClimAID: climate-informed disease modelling, forecasting and CMIP6 scenario analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Avik Kumar Sam"}]
license = "MIT"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "optuna>=3.0",
  "typer>=0.9",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "plotly>=5.18",
  "markdown>=3.5",
  "requests>=2.31",
  "pooch>=1.8",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
all = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
test = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
climaid = "climaid.cli:app"

[tool.setuptools.packages.find]
include = ["climaid*"]

[tool.setuptools.package-data]
climaid = ["assets/*", "browser_ui/static/*", "docs/*", "docs/dataset_samples/*",
           "documentation/*", "documentation/*/*", "documentation/*/*/*", "documentation/*/*/*/*",
           "documentation/*/*/*/*/*", "documentation/*/*/*/*/*/*"]
