site_name: ClimAID
site_description: Climate-informed disease modelling, forecasting and CMIP6 scenario analysis
site_url: https://sam-as.github.io/ClimAID/
docs_dir: site_docs

# Sets config.extra.version from climaid/__init__.py (single source of the version).
hooks:
  - docs_hooks.py

theme:
  name: material
  custom_dir: overrides        # site-wide "under testing" banner (overrides/main.html)

  logo: assets/ClimAID_logo_AS.png
  favicon: assets/ClimAID_logo_AS.png

  palette:
    - scheme: default
      primary: custom
      accent: custom

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.action.edit
    - toc.integrate
    - header.autohide

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false

nav:
  - Home: index.md

  - User guide:
      - "Status & validation (under testing)": guide/status.md
      - v2 forecasting: guide/v2_forecasting.md
      - Tuning & optimisation trials: guide/tuning.md
      - Climate scenario outlook: guide/scenarios.md
      - Reading the reports: guide/reports.md
      - Benchmarks & synthetic data: guide/benchmarks.md
      - Changelog: changelog.md

  - Core API:
      - DiseaseModel (v1): api/model.md
      - ClimAID v2: api/v2.md
      - ClimateData: api/climate.md

  - Projections:
      - DataManager: api/datasets.md
      - DiseaseProjection: api/projections.md
      - Visualization: api/plots.md

  - Intelligence:
      - LLM Client: api/llmclient.md
      - Reporting: api/reporting.md

  - Utilities:
      - Utils: api/utils.md

  - Resources:
      - Manuscript & Sample Datasets: api/resources.md

markdown_extensions:
  - pymdownx.snippets:          # site_docs/changelog.md includes the repository CHANGELOG.md
      base_path: [.]
      check_paths: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

repo_url: https://github.com/sam-as/ClimAID
repo_name: ClimAID

extra_css:
  - stylesheets/extra.css

copyright: >-
  © 2025–2026 ClimAID · Open-access software for climate-driven disease modelling ·
  Developed by <a href="https://www.avikkumarsam.in/home" target="_blank" rel="noopener">Avik Kumar Sam</a>
